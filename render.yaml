services:
  - type: web
    name: popoca-streaming
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: MAX_ACTIVE_TORRENTS
        value: "5"
