name: Popoca CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-test-and-build:
    name: Lint, Test & Multi-Stage Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências do Sistema (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Dependências NPM
        run: npm install

      - name: Auditoria de Segurança de Dependências
        run: npm audit --omit=dev

      - name: Verificação de Tipos TypeScript (Strict)
        run: npm run lint

      - name: Executar Testes Automatizados (Vitest)
        run: npm test

      - name: Compilar Frontend e Backend (esbuild + Vite)
        run: npm run build

      - name: Construir Imagem Docker Multi-Stage
        run: docker build -t popoca-streaming:latest .

  deploy:
    name: Verificação de Publicação
    needs: validate-test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validação do Pacote de Deploy
        run: |
          echo "Pipeline de validação e compilação concluído com sucesso."
          echo "Pronto para deploy automático via Render Webhook ou Docker Registry."
